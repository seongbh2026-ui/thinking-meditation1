<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2342"/>
      <stop offset="60%" stop-color="#111428"/>
      <stop offset="100%" stop-color="#070812"/>
    </radialGradient>

    <!-- Glowing Ring Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="25" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Heart Glow Filter -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Head Outline Gradient -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Cosmic Dust Rings -->
  <circle cx="600" cy="270" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="8 8"/>
  <circle cx="600" cy="270" r="260" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 12"/>

  <!-- Main Outer Glowing Halo Ring -->
  <circle cx="600" cy="270" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Head Profile & Heart Graphic Group -->
  <g transform="translate(600, 270)">
    <!-- Thought wave arcs behind head -->
    <path d="M -80 -20 A 90 90 0 0 1 -40 -80" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -92 -10 A 105 105 0 0 1 -45 -85" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 80 -10 A 100 100 0 0 1 40 80" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Head Silhouette -->
    <path d="M -20 85 C -20 85 -10 82 -5 65 C -2 55 -15 45 -25 40 C -45 32 -55 10 -55 -15 C -55 -55 -25 -85 20 -85 C 60 -85 85 -55 85 -15 C 85 20 65 50 45 60 C 35 65 30 72 30 85 Z" 
          fill="#0c1329" stroke="url(#headGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Glowing Heart in Brain/Mind Center -->
    <g transform="translate(8, -12) scale(1.15)" filter="url(#heartGlow)">
      <path d="M 0 16 C -20 -5 -32 -22 -15 -35 C -3 -44 0 -30 0 -22 C 0 -30 3 -44 15 -35 C 32 -22 20 -5 0 16 Z" 
            fill="url(#heartGrad)"/>
      <!-- Heart Highlight -->
      <path d="M -10 -28 A 6 6 0 0 1 -4 -33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Sparkle / Star Icon -->
    <g transform="translate(70, -75) scale(0.9)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#7dd3fc"/>
      <circle cx="16" cy="16" r="3" fill="#fde047"/>
    </g>
  </g>

  <!-- Typography Title & Subtitle -->
  <text x="600" y="520" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Noto Sans KR', sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#ffffff">
    THINKING MEDITATION
  </text>
  <text x="600" y="565" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#7dd3fc" opacity="0.9">
    집중력과 관조의 3D 생각 명상
  </text>
</svg>
