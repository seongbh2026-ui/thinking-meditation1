<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGradSq" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2342"/>
      <stop offset="60%" stop-color="#111428"/>
      <stop offset="100%" stop-color="#070812"/>
    </radialGradient>

    <filter id="glowSq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heartGlowSq" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="ringGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="headGradSq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="heartGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGradSq)"/>

  <circle cx="400" cy="360" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="10 10"/>
  <circle cx="400" cy="360" r="210" fill="none" stroke="url(#ringGradSq)" stroke-width="7" filter="url(#glowSq)"/>

  <g transform="translate(400, 360) scale(1.2)">
    <path d="M -80 -20 A 90 90 0 0 1 -40 -80" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -92 -10 A 105 105 0 0 1 -45 -85" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 80 -10 A 100 100 0 0 1 40 80" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <path d="M -20 85 C -20 85 -10 82 -5 65 C -2 55 -15 45 -25 40 C -45 32 -55 10 -55 -15 C -55 -55 -25 -85 20 -85 C 60 -85 85 -55 85 -15 C 85 20 65 50 45 60 C 35 65 30 72 30 85 Z" 
          fill="#0c1329" stroke="url(#headGradSq)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <g transform="translate(8, -12) scale(1.15)" filter="url(#heartGlowSq)">
      <path d="M 0 16 C -20 -5 -32 -22 -15 -35 C -3 -44 0 -30 0 -22 C 0 -30 3 -44 15 -35 C 32 -22 20 -5 0 16 Z" 
            fill="url(#heartGradSq)"/>
      <path d="M -10 -28 A 6 6 0 0 1 -4 -33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <g transform="translate(70, -75) scale(0.9)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#7dd3fc"/>
      <circle cx="16" cy="16" r="3" fill="#fde047"/>
    </g>
  </g>

  <text x="400" y="660" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Noto Sans KR', sans-serif" font-weight="900" font-size="40" letter-spacing="4" fill="#ffffff">
    THINKING MEDITATION
  </text>
  <text x="400" y="705" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#7dd3fc" opacity="0.9">
    THE INNER JOURNEY
  </text>
</svg>
